name: Build Micro Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Prepare Clean Android Platform Shell
        run: |
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/saved_main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart /tmp/saved_main.dart
          fi
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml /tmp/saved_pubspec.yaml
          fi

          if [ ! -d "android" ]; then
            flutter create --org edu.bsu.pharmacy.admin --project-name micro_admin --platforms=android .
          fi

          mkdir -p lib
          if [ -f "/tmp/saved_main.dart" ]; then
            cp /tmp/saved_main.dart lib/main.dart
          fi
          if [ -f "/tmp/saved_pubspec.yaml" ]; then
            cp /tmp/saved_pubspec.yaml pubspec.yaml
          fi
          rm -f test/widget_test.dart

      - name: Generate Rounded-Square App Launcher Icons
        run: |
          pip install Pillow
          python3 - << 'EOF'
          import os, io, base64
          from PIL import Image

          ICON_B64 = ""
          base_icon = Image.open(io.BytesIO(base64.b64decode(ICON_B64))).convert("RGBA")

          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res_base = "android/app/src/main/res"
          for folder, sz in mipmap_sizes.items():
              target_dir = os.path.join(res_base, folder)
              os.makedirs(target_dir, exist_ok=True)
              icon = base_icon.resize((sz, sz), Image.Resampling.LANCZOS)
              icon.save(os.path.join(target_dir, "ic_launcher.png"), "PNG")
              icon.save(os.path.join(target_dir, "ic_launcher_round.png"), "PNG")

          for anydpi in ["mipmap-anydpi-v26", "mipmap-anydpi"]:
              p = os.path.join(res_base, anydpi)
              if os.path.isdir(p):
                  for f in os.listdir(p):
                      os.remove(os.path.join(p, f))
          EOF

      - name: Configure Android Permissions, App Name & SDK 35
        run: |
          python3 - << 'EOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              m = f.read()

          if "android.permission.INTERNET" not in m:
              m = m.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application'
              )
          m = re.sub(r'android:label="[^"]*"', 'android:label="Micro Admin"', m)
          if 'android:usesCleartextTraffic="true"' not in m:
              m = m.replace("<application", '<application android:usesCleartextTraffic="true"')

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(m)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              g = f.read()
          g = re.sub(r'compileSdk\s+.*', 'compileSdk 35', g)
          g = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', g)
          g = re.sub(r'minSdk\s+.*', 'minSdk 21', g)
          g = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', g)
          g = re.sub(r'targetSdk\s+.*', 'targetSdk 35', g)
          g = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 35', g)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(g)
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Micro-Admin-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
