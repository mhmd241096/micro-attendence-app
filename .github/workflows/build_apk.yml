name: Build Micro Hub APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android Platform Shell (if missing)
        run: |
          if [ ! -d "android" ]; then
            flutter create --org edu.bsu.pharmacy --project-name micro_hub .
          fi

      - name: Generate Transparent Logo & Square App Icon
        run: |
          pip install Pillow requests
          python3 - << 'EOF'
          import os, io, requests
          from PIL import Image, ImageDraw

          os.makedirs("assets", exist_ok=True)
          url = "https://lh3.googleusercontent.com/d/1JIydTyv1jIsJzTiGwIaACozrlWr8PJen"
          resp = requests.get(url, timeout=20)
          raw_img = Image.open(io.BytesIO(resp.content)).convert("RGBA")

          # 1. Strip any dark/black background for transparent in-app header & intro logo
          w, h = raw_img.size
          transparent_logo = raw_img.copy()
          px = transparent_logo.load()
          for y in range(h):
              for x in range(w):
                  r, g, b, a = px[x, y]
                  if r < 30 and g < 30 and b < 30:
                      px[x, y] = (0, 0, 0, 0)

          # Crop to bounding box and center on a square transparent canvas
          bbox = transparent_logo.getbbox()
          if bbox:
              transparent_logo = transparent_logo.crop(bbox)
          side = max(transparent_logo.size)
          sq_transparent = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          scaled = transparent_logo.resize((460, 460), Image.Resampling.LANCZOS)
          sq_transparent.paste(scaled, ((512 - 460) // 2, (512 - 460) // 2), scaled)
          sq_transparent.save("assets/logo.png", "PNG")

          # 2. Generate crisp Square Launcher Icon (ic_launcher.png & ic_launcher_round.png)
          def make_square_launcher(size):
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              mask = Image.new("L", (size, size), 0)
              draw = ImageDraw.Draw(mask)
              radius = int(size * 0.18)
              draw.rounded_rectangle((0, 0, size, size), radius=radius, fill=255)

              bg = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              pad = int(size * 0.06)
              inner = size - (pad * 2)
              fg = sq_transparent.resize((inner, inner), Image.Resampling.LANCZOS)
              bg.paste(fg, (pad, pad), fg)
              canvas.paste(bg, (0, 0), mask)
              return canvas

          mipmap_sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res_base = "android/app/src/main/res"
          for folder, sz in mipmap_sizes.items():
              target_dir = os.path.join(res_base, folder)
              os.makedirs(target_dir, exist_ok=True)
              icon = make_square_launcher(sz)
              icon.save(os.path.join(target_dir, "ic_launcher.png"), "PNG")
              icon.save(os.path.join(target_dir, "ic_launcher_round.png"), "PNG")

          # Remove adaptive XML overrides so Android displays our exact square icon
          for anydpi in ["mipmap-anydpi-v26", "mipmap-anydpi"]:
              p = os.path.join(res_base, anydpi)
              if os.path.isdir(p):
                  for f in os.listdir(p):
                      os.remove(os.path.join(p, f))
          EOF

      - name: Configure Android Permissions, App Name & SDK 35
        run: |
          python3 - << 'EOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              m = f.read()

          if "android.permission.INTERNET" not in m:
              m = m.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <application'
              )
          m = re.sub(r'android:label="[^"]*"', 'android:label="Micro Hub"', m)
          if 'android:usesCleartextTraffic="true"' not in m:
              m = m.replace("<application", '<application android:usesCleartextTraffic="true"')

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(m)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r", encoding="utf-8") as f:
              g = f.read()
          g = re.sub(r'compileSdk\s+.*', 'compileSdk 35', g)
          g = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', g)
          g = re.sub(r'minSdk\s+.*', 'minSdk 21', g)
          g = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', g)
          g = re.sub(r'targetSdk\s+.*', 'targetSdk 35', g)
          g = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 35', g)
          with open(gradle_path, "w", encoding="utf-8") as f:
              f.write(g)
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Micro-Hub-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
