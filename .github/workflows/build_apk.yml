name: Build Release APK on Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Microbiology Portal APK (Cloud)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Stable Flutter SDK (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 4. Create Clean Android Project & Inject Code
        run: |
          flutter create --org com.bsu.microbiology --project-name micro_portal_app --platforms=android clean_app

          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart clean_app/lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart clean_app/lib/main.dart
          fi

          rm -f clean_app/test/widget_test.dart

      - name: 5. Add Dependencies, Set Launcher Icon & Configure Android
        working-directory: clean_app
        run: |
          flutter pub add http:^1.2.2 image_picker:^1.1.2 url_launcher:^6.3.0 shared_preferences:^2.3.2

          sed -i 's/android:label="micro_portal_app"/android:label="Microbiology Portal"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

          ICON_B64=""
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              echo "$ICON_B64" | base64 -d > "$dir/ic_launcher.png"
              if [ -f "$dir/ic_launcher_round.png" ]; then
                echo "$ICON_B64" | base64 -d > "$dir/ic_launcher_round.png"
              fi
            fi
          done

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
            sed -i 's/minSdk flutter.minSdkVersion/minSdk 21/g' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          fi

      - name: 6. Build Release APK
        working-directory: clean_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 7. Upload Ready-to-Download APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microbiology-Portal-Release-APK
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
