name: Build Release APK on Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Microbiology Portal APK (Cloud)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Set up Java 17 for Android Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Stable Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 4. Create Clean Android Project & Inject Code + Original Badge Icon
        run: |
          flutter create --org com.bsu.microbiology --project-name micro_portal_app --platforms=android clean_app

          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart clean_app/lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart clean_app/lib/main.dart
          fi

          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml clean_app/pubspec.yaml
          fi

          # Ensure INTERNET permission and usesCleartextTraffic in AndroidManifest.xml
          python3 -c '
          p = "clean_app/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application")
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", "<application android:usesCleartextTraffic=\"true\"")
          s = s.replace("android:label=\"micro_portal_app\"", "android:label=\"Microbiology Portal\"")
          open(p, "w").write(s)
          '

          # Inject Original Rounded-Square Badge as Android APK Launcher Icon
          ICON_B64=""
          for dir in clean_app/android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              echo "$ICON_B64" | base64 -d > "$dir/ic_launcher.png"
              echo "$ICON_B64" | base64 -d > "$dir/ic_launcher_round.png" || true
            fi
          done

      - name: 5. Resolve Dependencies & Build Release APK
        working-directory: clean_app
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: 6. Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Microbiology-Portal-Release-APK
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
